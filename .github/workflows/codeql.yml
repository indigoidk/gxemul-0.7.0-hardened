# CodeQL, advanced setup (owner decision 2026-11-05): the same analysis the default setup ran (C/C++, build-mode none,
# so every source file is read without a build), but with regress/artifacts/ and experiments/ excluded by the config file.
# regress/artifacts/ holds archived COPIES of product sources (kill-table variants and baselines); scanning them
# repeats each product alert once per copy.  Switch the repository from Default to Advanced setup when this lands.
name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 6 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (c-cpp)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
